<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Coffee Shop</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: url("bg1.jpeg") no-repeat center center/cover;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 10px;
        text-align: center;
        width: 350px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }

      .login-container h2 {
        margin-bottom: 20px;
        color: white;
      }

      .input-field {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: none;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 16px;
      }

      .input-field::placeholder {
        /* color: rgba(255, 255, 255, 0.7); */
        color: white;
      }

      .login-btn {
        width: 100%;
        padding: 10px;
        background: #ffb74d;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        color: white;
        cursor: pointer;
        transition: 0.3s;
      }

      .login-btn:hover {
        background: #ff9800;
      }

      .register-link {
        display: block;
        margin-top: 15px;
        color: white;
        text-decoration: none;
        font-size: 14px;
      }

      .register-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Login to Your Account</h2>
      <form>
        <input type="email" class="input-field" placeholder="Email" required />
        <input
          type="password"
          class="input-field"
          placeholder="Password"
          required
        />
        <button type="submit" class="login-btn">Login</button>
      </form>
      <a href="register.html" class="register-link"
        >Don't have an account? Register</a
      >
    </div>
  </body>
</html>
